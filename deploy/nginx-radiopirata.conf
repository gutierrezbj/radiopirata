# nginx de ejemplo para radio.jrgblanco.com.
# Copiar a /etc/nginx/sites-available/radiopirata, enlazar en sites-enabled, comprobar con
# `sudo nginx -t` y recargar con `sudo systemctl reload nginx`.
#
# Los certificados los coloca certbot (ver docs/DESPLIEGUE.md). Antes de tener certificado,
# usar solo el bloque de escucha en el puerto 80 sin la redirección.

server {
    listen 80;
    listen [::]:80;
    server_name radio.jrgblanco.com;

    # Ruta que usa certbot para emitir y renovar el certificado.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name radio.jrgblanco.com;

    ssl_certificate     /etc/letsencrypt/live/radio.jrgblanco.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/radio.jrgblanco.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # El audio no pasa por aquí: va del servidor de cada emisora al navegador.
    # Por eso este proxy mueve muy pocos datos y no necesita buffers grandes.
    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
